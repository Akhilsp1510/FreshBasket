{% extends "base/base.html" %}

{% block content %}
<div class="container py-5" style="max-width:520px;">
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h5 class="fw-bold mb-4"><i class="bi bi-geo-alt me-2 text-success"></i>{{ title }}</h5>
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-sm-6">
          <label class="form-label small fw-semibold">Label</label>
          {{ form.label }}
        </div>
        <div class="col-sm-6">
          <label class="form-label small fw-semibold">Full Name</label>
          {{ form.full_name }}
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Phone</label>
          {{ form.phone }}
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Address Line 1</label>
          {{ form.address_line1 }}
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Address Line 2 <span class="text-muted">(optional)</span></label>
          {{ form.address_line2 }}
        </div>
        <div class="col-sm-5">
          <label class="form-label small fw-semibold">City</label>
          {{ form.city }}
        </div>
        <div class="col-sm-4">
          <label class="form-label small fw-semibold">State</label>
          {{ form.state }}
        </div>
        <div class="col-sm-3">
          <label class="form-label small fw-semibold">PIN</label>
          {{ form.pincode }}
        </div>
        <div class="col-12">
          <div class="form-check">
            {{ form.is_default }}
            <label class="form-check-label small" for="{{ form.is_default.id_for_label }}">Set as default address</label>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-success px-4 rounded-3 fw-semibold">Save Address</button>
        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary px-4 rounded-3">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
